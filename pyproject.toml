[project]
name = "veddaksha-foundation"
version = "0.1.0"
description = "Ved Daksha Foundation Web and API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pymongo>=4.5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.1",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
